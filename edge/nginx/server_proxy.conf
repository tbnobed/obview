# /data/nginx/custom/server_proxy.conf  (Dallas edge NPM only)
#
# NPM auto-includes this file inside every proxy host's `server {}` block.
# It is the inverse of the origin's server_proxy.conf:
#   - origin sets `proxy_request_buffering off` so chunks stream straight
#     to disk
#   - the edge sets it ON so each tus PATCH lands on local disk at LAN
#     speed before being replayed to origin over the SiteMagic tunnel.
#
# Effect: office client sees ~1ms RTT for the entire upload; the slow
# WAN segment becomes a controlled edge -> origin path with a warm
# keepalive pool and (combined with the parallel-tus client) up to 4
# concurrent backend connections per file.

# Allow arbitrarily large request bodies (tus uploads are GB-scale).
client_max_body_size 0;

# Body buffering: small in-memory buffer, spill to disk for the rest.
# 1m keeps RAM bounded under many concurrent uploads; the on-disk
# spill is what actually absorbs the chunk before forwarding.
client_body_buffer_size 1m;
client_body_temp_path /var/cache/nginx/edge_body 1 2;

# THE point of the edge box.
proxy_request_buffering on;
proxy_buffering on;
proxy_buffers 16 64k;
proxy_busy_buffers_size 256k;

# Reuse the upstream keepalive pool defined in http.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_socket_keepalive on;

# Generous timeouts. /api/uploads/finalize concatenates multi-GB part
# files on the origin and can take minutes for very large uploads.
proxy_connect_timeout 30s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;

# Pass through every tus protocol header verbatim. Missing any of these
# will cause silent upload corruption or 400s on the origin.
proxy_set_header Host                $host;
proxy_set_header X-Real-IP           $remote_addr;
proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto   $scheme;
proxy_set_header Upload-Offset       $http_upload_offset;
proxy_set_header Upload-Length       $http_upload_length;
proxy_set_header Upload-Metadata     $http_upload_metadata;
proxy_set_header Upload-Concat       $http_upload_concat;
proxy_set_header Upload-Defer-Length $http_upload_defer_length;
proxy_set_header Upload-Checksum     $http_upload_checksum;
proxy_set_header Tus-Resumable       $http_tus_resumable;
proxy_set_header Tus-Version         $http_tus_version;
proxy_set_header Tus-Extension       $http_tus_extension;
proxy_set_header Content-Type        $http_content_type;

# WebSocket upgrade pass-through (uses the map from http.conf).
proxy_set_header Upgrade             $http_upgrade;
proxy_set_header Connection          $connection_upgrade;

# Don't gzip request bodies — tus chunks are already opaque and gzip
# would change the byte count nginx forwards.
gzip off;
