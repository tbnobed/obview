# /data/nginx/custom/http.conf  (Dallas edge NPM only — do NOT copy to origin)
#
# NPM auto-includes this file inside the top-level `http {}` block.
# It defines:
#   - the WebSocket upgrade map used by server_proxy.conf
#   - a keepalive upstream pool to the obviu origin so PATCH chunks
#     reuse a warm TLS connection over the SiteMagic tunnel instead
#     of paying a handshake per request.
#
# The actual upstream IP is the origin's SiteMagic-side address.
# Edit the `server` line below before deploying.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream obviu_origin {
    # Origin host as reachable over SiteMagic. Replace with the real IP.
    server 10.0.0.1:443;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}
