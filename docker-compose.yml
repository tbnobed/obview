# Docker Compose configuration for OBview.io
# Note: version key is obsolete in Compose V2 and can be removed

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_DISABLE_REGISTRATION=${VITE_DISABLE_REGISTRATION:-true}
        # Short-link domain baked into the client bundle at build time.
        # e.g. SHORT_LINK_BASE_URL=https://t.obviu.io in your .env
        - VITE_SHORT_LINK_BASE_URL=${SHORT_LINK_BASE_URL:-}
        # Canonical app host (e.g. https://tbn.obviu.io). Baked into the
        # client bundle. When a signed-in viewer hits a short share URL on
        # t.obviu.io, the resolver does a full-page redirect to this host
        # so they land on the authenticated app even if t.obviu.io's nginx
        # only proxies share endpoints. Leave unset in dev / replit so
        # navigation stays in-app.
        - VITE_APP_BASE_URL=${APP_BASE_URL:-}
    container_name: obview_app
    restart: always
    # Run a minimal init (tini) as PID 1 so signals are forwarded and dead
    # child processes get reaped — prevents unkillable zombie containers on
    # stop/rebuild (ffmpeg/whisper child processes are prone to this).
    init: true
    ports:
      - "5000:5000"  # Map host port 5000 to container port 5000 (where the server is actually listening)
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000  # Match the server's actual PORT
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/obview
      - SESSION_SECRET=${SESSION_SECRET}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      # Public self-registration is blocked server-side by default. Leave
      # false for invitation-only account creation.
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      # Canonical authenticated app host used for links in server-generated
      # emails. Reuse the same APP_BASE_URL that is baked into the client.
      - APP_URL=${APP_BASE_URL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_NAME=${ADMIN_NAME:-Administrator}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      # Short-link domain used by the server when constructing share URLs
      # returned from the API (e.g. https://t.obviu.io). If unset the
      # server falls back to the inbound request's host.
      - SHORT_LINK_BASE_URL=${SHORT_LINK_BASE_URL:-}
      # Cross-subdomain session cookie domain. Set to e.g. .obviu.io so the
      # session cookie is shared between tbn.obviu.io (app) and t.obviu.io
      # (short-link host) — without it, signed-in viewers land on the public
      # share page instead of the authenticated project view.
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      # Flag to signal a Docker environment to use proper database connection strategy
      - IS_DOCKER=true
      # Upload directory for file operations
      - UPLOAD_DIR=/app/uploads
      # Video processing timeout configuration (in milliseconds)
      - VIDEO_TIMEOUT_QUALITY=${VIDEO_TIMEOUT_QUALITY:-3600000}
      - VIDEO_TIMEOUT_SCRUB=${VIDEO_TIMEOUT_SCRUB:-1800000}
      - VIDEO_TIMEOUT_SPRITE=${VIDEO_TIMEOUT_SPRITE:-600000}
      - VIDEO_TIMEOUT_METADATA=${VIDEO_TIMEOUT_METADATA:-300000}
      # Video encoding quality settings (optional)
      - VIDEO_MAIN_CRF=${VIDEO_MAIN_CRF:-24}
      - VIDEO_MAIN_PRESET=${VIDEO_MAIN_PRESET:-medium}
      - VIDEO_SCRUB_CRF=${VIDEO_SCRUB_CRF:-28}
      - VIDEO_SCRUB_FPS=${VIDEO_SCRUB_FPS:-15}
      - VIDEO_SCRUB_SCALE=${VIDEO_SCRUB_SCALE:--2:180}
      # Local transcription (whisper.cpp) configuration
      - TRANSCRIPTION_ENABLED=${TRANSCRIPTION_ENABLED:-true}
      - WHISPER_MODEL=${WHISPER_MODEL:-base.en}
      - WHISPER_THREADS=${WHISPER_THREADS:-4}
      - WHISPER_MODELS_DIR=/app/models
      # Local AI summarization (llama.cpp via node-llama-cpp) configuration
      - SUMMARIZATION_ENABLED=${SUMMARIZATION_ENABLED:-true}
      - LLAMA_MODEL=${LLAMA_MODEL:-llama-3.2-1b-instruct.Q4_K_M.gguf}
      - LLAMA_THREADS=${LLAMA_THREADS:-4}
      - LLAMA_MODELS_DIR=/app/models/llama
      - LLAMA_API_URL=${LLAMA_API_URL:-}
      # DGX Spark companion box (reachable over the 200Gb DAC link)
      - SPARK_HOST=${SPARK_HOST:-}
      - SPARK_PORT=${SPARK_PORT:-22}
      - SPARK_DIAG_URL=${SPARK_DIAG_URL:-}
      # GPU transcription worker (local L4 or Spark) + diarization toggle
      - TRANSCRIBE_WORKER_URL=${TRANSCRIBE_WORKER_URL:-}
      - TRANSCRIPTION_DIARIZE=${TRANSCRIPTION_DIARIZE:-true}
      # NVIDIA Container Toolkit triggers — these env vars are what actually
      # cause the toolkit's prestart hook to bind-mount the host's NVIDIA
      # userspace libs (nvidia-smi, libnvidia-encode.so.1, libcuda.so.1, etc.)
      # into the container. Without these the GPU is "reserved" but no driver
      # libs are present, so ffmpeg can't see NVENC.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      # Bind-mount the dedicated data disks (/srv/obviu/*) instead of using
      # named Docker volumes. Named volumes live under /var/lib/docker on the
      # root disk (/dev/sda2) — that is how 698GB of uploads filled root to
      # 100% and took Postgres (and all 50 users) down. The two big disks
      # were provisioned for exactly this and were sitting empty.
      - /srv/obviu/uploads:/app/uploads
      - /srv/obviu/db-backups:/app/db-backups
      - whisper_models:/app/models
      - llama_models:/app/models/llama
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s # More time for application startup and database migration
    # Use the nvidia container runtime so the host's GPU + driver libs are
    # injected into the container at start (T4 for NVENC + local AI).
    # Requires the NVIDIA Container Toolkit on the host and an nvidia entry
    # in /etc/docker/daemon.json (added by `nvidia-ctk runtime configure`).
    runtime: nvidia
    # Restart the container if it fails the health check.
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, utility, compute]

  db:
    image: postgres:16-alpine
    container_name: obview_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=obview
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  whisper_models:
  llama_models:

networks:
  app_network:
    driver: bridge