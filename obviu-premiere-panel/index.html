<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Sign-in view -->
    <div id="view-auth" class="view">
      <div>
        <h1>Obviu Review</h1>
        <p class="muted small">Connect Premiere to your Obviu workspace.</p>
      </div>
      <div class="card auth-card">
        <div class="field">
          <label>Server URL</label>
          <input id="baseUrl" type="text" placeholder="https://app.obviu.io" />
        </div>
        <div class="field">
          <label>Email or username</label>
          <input id="username" type="text" placeholder="you@studio.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="password" type="password" placeholder="••••••••" />
        </div>
        <button id="btnConnect" class="full">Sign in</button>
        <p class="muted small">Sign in with your normal Obviu account.</p>
        <div id="authError" class="error"></div>
      </div>
    </div>

    <!-- Projects view -->
    <div id="view-projects" class="view hidden">
      <div class="toolbar">
        <span id="meLabel" class="muted small"></span>
        <button id="btnSignOut" class="link">Sign out</button>
      </div>
      <h2>Projects</h2>
      <div id="projectsList" class="list"></div>
    </div>

    <!-- Files view -->
    <div id="view-files" class="view hidden">
      <div class="toolbar">
        <button id="btnBackProjects" class="link">&larr; Projects</button>
      </div>
      <h2 id="filesTitle">Files</h2>
      <div id="breadcrumb" class="muted small"></div>
      <div id="foldersList" class="list"></div>
      <div id="filesList" class="list"></div>
    </div>

    <!-- File detail view -->
    <div id="view-file" class="view hidden">
      <div class="toolbar">
        <button id="btnBackFiles" class="link">&larr; Files</button>
        <button id="btnRefresh" class="link">Refresh</button>
      </div>
      <h2 id="fileTitle" class="file-title">File</h2>

      <div class="field">
        <label>Version</label>
        <select id="versionSelect"></select>
      </div>

      <webview id="mediaView" class="media-view" width="100%" height="320" src=""></webview>

      <div class="actions">
        <button id="btnImport">Import to Premiere</button>
        <button id="btnPullMarkers" class="secondary">Pull comments to markers</button>
        <button id="btnShare" class="secondary">Copy share link</button>
      </div>
      <div class="actions">
        <button id="btnApprove" class="ok">Approve</button>
        <button id="btnRequest" class="warn">Request changes</button>
      </div>
      <div id="fileStatus" class="status"></div>

      <section class="card">
        <h3>Comments</h3>
        <textarea id="commentInput" rows="2" placeholder="Write a comment…"></textarea>
        <div class="row between">
          <label class="checkrow">
            <input id="commentAtTime" type="checkbox" />
            Attach playhead time
          </label>
          <button id="btnPostComment">Post</button>
        </div>
        <div id="commentsList" class="list"></div>
      </section>

      <section class="card">
        <button id="btnToggleExport" type="button" class="disclosure">
          <span>Send your cut</span>
          <span id="exportCaret" class="caret">&#9656;</span>
        </button>
        <div id="exportBody" class="hidden">
          <p class="muted small">Export the active Premiere sequence and upload it to Obviu.</p>
          <div class="row wrap preset-row">
            <button id="btnPickPreset" class="secondary">Choose preset…</button>
            <span id="presetLabel" class="muted small">No preset selected</span>
          </div>
          <div class="field">
            <label>Export name</label>
            <input id="exportName" type="text" placeholder="My Cut.mp4" />
          </div>
          <label class="checkrow">
            <input id="destVersion" type="radio" name="dest" checked />
            <span id="destVersionLabel">New version of this file</span>
          </label>
          <label class="checkrow">
            <input id="destNew" type="radio" name="dest" />
            Upload as a new file (this folder)
          </label>
          <button id="btnExportUpload" class="full">Export &amp; upload</button>
          <div id="seqStatus" class="status"></div>
        </div>
      </section>
    </div>

    <script src="index.js"></script>
  </body>
</html>
